# Smoke variant of RoboTwin's env_cfg/task_config/demo_clean.yml (stage A).
#
# Differences from demo_clean.yml, all intentional:
#   * episode_num: 50 -> 1        single expert episode for the smoke gate
#   * save_path -> __GENERATED_DIR__   rendered by scripts/data/collect_expert.sh
#     so nothing can overwrite the shipped demonstrations under data/demo_clean/...
#   * render_freq stays 0         headless; the collector still re-renders
# Everything else (save_freq 15, D435 320x240 cameras, rgb+qpos+endpose, clean
# scene, seen instructions) is identical to the native demo_clean config.
render_freq: 0
episode_num: 1
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
eval_instruction: seen
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: __GENERATED_DIR__
clear_cache_freq: 5
collect_data: true
eval_video_log: true
