[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwp-sim2real"
version = "0.1.0"
description = "Reproducible GigaWorld-Policy experiments across inference and bimanual simulation"
requires-python = ">=3.10"
# The importable package is deliberately light: it must be installable in the
# simulation environment, which knows nothing about diffusers or transformers.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
